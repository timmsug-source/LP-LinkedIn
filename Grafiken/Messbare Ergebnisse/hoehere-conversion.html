<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Höhere Conversion — Timm Schurig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#070E1C; --navy-900:#0A1320; --navy-850:#0C1724; --navy-800:#111B2B;
    --navy-750:#162234; --navy-700:#1E2C40; --navy-600:#2A3A52;
    --green-400:#2FD79A; --green-500:#16C98A; --green-700:#0C9E69;
    --ink-100:#E8EDF5; --ink-400:#90A2B8; --ink-500:#6B7C92;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--navy-950);font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--green-500);text-decoration:none}
  a:hover{color:var(--green-400)}

  /* Einzelne Grafik: max-width entfernen, damit sie die volle Spaltenbreite füllt */
  .ts-benefits{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,24px)}

  .ts-card{position:relative;container-type:inline-size;display:flex;flex-direction:column;overflow:hidden;
    border-radius:28px;background:var(--navy-850);border:1px solid var(--navy-700);
    box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .ts-card__glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 55% at 18% 92%,rgba(22,201,138,.20),transparent 70%),
               radial-gradient(55% 50% at 88% 95%,rgba(78,70,180,.22),transparent 72%)}
  .ts-card__visual{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(220px,26cqi + 150px,320px)}
  .ts-card__text{position:relative;display:flex;flex-direction:column;gap:12px;padding:clamp(24px,7cqi,40px)}
  .ts-card h3{margin:0;font-size:clamp(24px,6cqi,32px);font-weight:900;letter-spacing:-.03em;line-height:1.05;color:var(--ink-100)}
  .ts-card p{margin:0;font-size:clamp(15px,3.4cqi,18px);line-height:1.55;color:var(--ink-400);text-wrap:pretty}

  /* 1 — Flächen-Chart */
  .ts-legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:clamp(24px,7cqi,40px) clamp(24px,7cqi,40px) 18px}
  .ts-legend b{font-size:clamp(14px,3.2cqi,17px);font-weight:800;color:var(--ink-100)}
  .ts-legend span{font-size:clamp(14px,3.2cqi,17px);color:var(--ink-500)}
  .ts-legend svg{flex:0 0 auto}
  .ts-chart{display:block;width:100%;height:clamp(140px,34cqi,200px)}

  /* 2 — Toast-Stapel */
  .ts-stack{position:relative;margin:clamp(28px,8cqi,48px) clamp(20px,6cqi,36px) clamp(20px,5cqi,32px);padding-top:clamp(28px,7cqi,44px)}
  .ts-stack__ghost{position:absolute;left:14%;right:14%;top:0;height:clamp(34px,9cqi,52px);border-radius:20px;background:var(--navy-900);border:1px solid var(--navy-700);opacity:.55}
  .ts-stack__ghost--2{left:7%;right:7%;top:clamp(14px,4cqi,22px);background:var(--navy-800);opacity:.8}
  .ts-toast{position:relative;display:flex;gap:clamp(14px,4cqi,22px);padding:clamp(18px,5cqi,28px);border-radius:24px;
    background:var(--navy-750);border:1px solid var(--navy-700);box-shadow:0 26px 60px rgba(0,0,0,.55)}
  .ts-toast__icon{flex:0 0 auto;width:clamp(48px,13cqi,68px);height:clamp(48px,13cqi,68px);border-radius:18px;
    display:flex;align-items:center;justify-content:center;background:rgba(22,201,138,.12);border:1px solid rgba(22,201,138,.35)}
  .ts-toast__icon svg{width:56%;height:56%}
  .ts-toast__body{display:flex;flex-direction:column;gap:8px;min-width:0}
  .ts-toast__head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .ts-toast__head b{font-size:clamp(16px,4cqi,22px);font-weight:900;letter-spacing:-.02em;color:var(--ink-100)}
  .ts-pill{padding:3px 12px;border-radius:999px;background:var(--green-500);font-size:clamp(13px,3cqi,16px);font-weight:800;color:var(--navy-950)}
  .ts-toast__body p{font-size:clamp(14px,3.2cqi,17px)}

  /* 3 — Vorher/Nachher-Balken */
  .ts-bars{position:relative;display:flex;flex-direction:column;gap:clamp(20px,5cqi,32px);padding:clamp(32px,9cqi,52px) clamp(24px,7cqi,40px) clamp(8px,2cqi,12px)}
  .ts-bar__row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
  .ts-bar__label{font-size:clamp(14px,3.2cqi,17px);color:var(--ink-500)}
  .ts-bar__label--on{color:var(--ink-400)}
  .ts-bar__value{font-size:clamp(20px,5.4cqi,28px);font-weight:900;letter-spacing:-.02em;color:var(--ink-400)}
  .ts-bar__value--on{font-size:clamp(26px,7cqi,38px);letter-spacing:-.03em;color:var(--green-500)}
  .ts-bar{height:clamp(16px,3.4cqi,22px);border-radius:999px;background:var(--navy-900);border:1px solid var(--navy-700);overflow:hidden}
  .ts-bar i{display:block;height:100%;border-radius:999px;background:var(--navy-600)}
  .ts-bar i.on{background:linear-gradient(90deg,var(--green-700),var(--green-400));box-shadow:0 0 32px rgba(22,201,138,.35)}
</style>
</head>
<body>

<section class="ts-benefits">

  <article class="ts-card">
    <div class="ts-card__glow"></div>
    <div class="ts-card__visual">
      <div class="ts-bars">
        <div>
          <div class="ts-bar__row"><span class="ts-bar__label">Conversion vorher</span><span class="ts-bar__value">1.4%</span></div>
          <div class="ts-bar"><i style="width:27%"></i></div>
        </div>
        <div>
          <div class="ts-bar__row"><span class="ts-bar__label ts-bar__label--on">Conversion nachher</span><span class="ts-bar__value ts-bar__value--on">5.1 %</span></div>
          <div class="ts-bar"><i class="on" style="width:100%"></i></div>
        </div>
      </div>
    </div>
    <div class="ts-card__text">
      <h3>Höhere Conversion</h3>
      <p>Steigere die Performance sämtlicher Marketingmaßnahmen, da unsere Designs verkaufspsychologisch optimiert sind.</p>
    </div>
  </article>

</section>

</body>
</html>
