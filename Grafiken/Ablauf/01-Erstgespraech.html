<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01-Erstgespraech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#070E1C;color:#E8EDF5;font-family:'Hanken Grotesk',system-ui,sans-serif}</style>
</head>
<body>
<div style="width:600px;height:420px;border-radius:24px;border:1px solid #1E2C40;background:radial-gradient(60% 70% at 10% 100%,rgba(22,201,138,.16),transparent 70%),radial-gradient(60% 70% at 100% 100%,rgba(78,70,180,.2),transparent 70%),#0A1320;padding:28px;position:relative;overflow:hidden">
  <div style="background:#111B2B;border:1px solid #1E2C40;border-radius:18px;box-shadow:0 24px 48px rgba(0,0,0,.45);overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1E2C40">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:#F2615A"></span>Erstgespräch · Timm Schurig</div>
      <div style="font-size:12px;color:#90A2B8;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;background:#162234;border:1px solid #1E2C40">12:48 / 30:00</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px">
      <div style="height:150px;border-radius:12px;background:linear-gradient(160deg,#162234,#0C1724);display:flex;align-items:center;justify-content:center;position:relative">
        <div style="width:64px;height:64px;border-radius:50%;background:#16C98A;color:#070E1C;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(22,201,138,.18)">TS</div>
        <div style="position:absolute;left:10px;bottom:8px;font-size:11px;color:#B8C4D4">Timm</div>
      </div>
      <div style="height:150px;border-radius:12px;background:linear-gradient(160deg,#1E2C40,#0C1724);display:flex;align-items:center;justify-content:center;position:relative">
        <div style="width:64px;height:64px;border-radius:50%;background:#2A3A52;color:#E8EDF5;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center">Du</div>
        <div style="position:absolute;left:10px;bottom:8px;font-size:11px;color:#B8C4D4">Du</div>
      </div>
    </div>
    <div style="display:flex;justify-content:center;gap:10px;padding:4px 0 14px">
      <div style="width:34px;height:34px;border-radius:50%;background:#162234;border:1px solid #1E2C40"></div>
      <div style="width:34px;height:34px;border-radius:50%;background:#162234;border:1px solid #1E2C40"></div>
      <div style="width:52px;height:34px;border-radius:999px;background:#F2615A"></div>
    </div>
  </div>
  <div style="position:absolute;right:24px;bottom:22px;width:230px;background:#162234;border:1px solid #2A3A52;border-radius:16px;padding:14px 16px;box-shadow:0 20px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:9px">
    <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B7C92;font-weight:700">Gesprächsnotizen</div>
    <div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="width:16px;height:16px;border-radius:50%;background:#16C98A;color:#070E1C;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center">✓</span>Deine Situation</div>
    <div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="width:16px;height:16px;border-radius:50%;background:#16C98A;color:#070E1C;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center">✓</span>Deine Ziele</div>
    <div style="display:flex;gap:8px;align-items:center;font-size:13px;color:#90A2B8"><span style="width:16px;height:16px;border-radius:50%;border:1.5px solid #16C98A"></span>Passen wir zusammen?</div>
  </div>
  <div style="position:absolute;left:24px;bottom:26px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(22,201,138,.12);border:1px solid rgba(22,201,138,.35);font-size:12px;color:#6FE7BE;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:#16C98A"></span>Unverbindlich · kein Formular</div>
</div>
</body>
</html>
