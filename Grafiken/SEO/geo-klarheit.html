<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klarheit & Struktur — Timm Schurig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#070E1C;font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#16C98A;text-decoration:none}
  a:hover{color:#2FD79A}
  h3{margin:0}
  p{margin:0}
  /* Einzelne Grafik — max-width entfernen, damit sie die volle Spaltenbreite füllt */
  .ts-wrap{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,24px)}
</style>
</head>
<body>
<div class="ts-wrap">
    <div style="position:relative; display:flex; flex-direction:column; border-radius:28px; overflow:hidden; background:#0C1724; border:1px solid #1E2C40; box-shadow:0 24px 60px rgba(0,0,0,0.45);">
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 55% at 18% 92%, rgba(22,201,138,0.20), transparent 70%), radial-gradient(55% 50% at 88% 95%, rgba(78,70,180,0.22), transparent 72%);"></div>
      <div style="position:relative; padding:32px 28px 8px 28px; display:flex; flex-direction:column; gap:12px;">
        <div style="display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:16px; background:#162234; border:1px solid rgba(22,201,138,0.35);">
          <span style="font-size:14px; font-weight:800; color:#16C98A;">H1</span>
          <div style="flex:1; height:10px; border-radius:999px; background:#2A3A52;"></div>
        </div>
        <div style="display:flex; align-items:center; gap:14px; margin-left:22px; padding:12px 18px; border-radius:14px; background:#111B2B; border:1px solid #1E2C40;">
          <span style="font-size:13px; font-weight:800; color:#90A2B8;">H2</span>
          <div style="flex:1; height:8px; border-radius:999px; background:#1E2C40;"></div>
        </div>
        <div style="display:flex; align-items:center; gap:14px; margin-left:44px; padding:12px 18px; border-radius:14px; background:#111B2B; border:1px solid #1E2C40;">
          <span style="font-size:13px; font-weight:800; color:#6B7C92;">H3</span>
          <div style="flex:1; height:8px; border-radius:999px; background:#1E2C40;"></div>
        </div>
        <div style="display:flex; align-items:center; gap:14px; margin-left:22px; padding:12px 18px; border-radius:14px; background:#111B2B; border:1px solid #1E2C40;">
          <span style="font-size:13px; font-weight:800; color:#90A2B8;">H2</span>
          <div style="flex:1; height:8px; width:60%; border-radius:999px; background:#1E2C40;"></div>
        </div>
      </div>
      <div style="position:relative; padding:28px 28px 30px 28px; display:flex; flex-direction:column; gap:10px;">
        <h3 style="margin:0; font-size:30px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; color:#E8EDF5;">Klarheit &amp; Struktur</h3>
        <p style="margin:0; font-size:17px; line-height:1.55; color:#90A2B8; text-wrap:pretty;">Eindeutige Gliederung und klare Aussagen, damit KI-Systeme deine Inhalte fehlerfrei erfassen und richtig zuordnen.</p>
      </div>
    </div>
</div>
</body>
</html>
