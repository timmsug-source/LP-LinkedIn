<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zitierfähigkeit — Timm Schurig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#070E1C;font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#16C98A;text-decoration:none}
  a:hover{color:#2FD79A}
  h3{margin:0}
  p{margin:0}
  /* Einzelne Grafik — max-width entfernen, damit sie die volle Spaltenbreite füllt */
  .ts-wrap{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,24px)}
</style>
</head>
<body>
<div class="ts-wrap">
    <div style="position:relative; display:flex; flex-direction:column; border-radius:28px; overflow:hidden; background:#0C1724; border:1px solid #1E2C40; box-shadow:0 24px 60px rgba(0,0,0,0.45);">
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 55% at 18% 92%, rgba(22,201,138,0.20), transparent 70%), radial-gradient(55% 50% at 88% 95%, rgba(78,70,180,0.22), transparent 72%);"></div>
      <div style="position:relative; padding:32px 28px 8px 28px; display:flex; flex-direction:column; gap:14px;">
        <div style="align-self:flex-start; padding:10px 16px; border-radius:16px 16px 16px 4px; background:#111B2B; border:1px solid #1E2C40; font-size:15px; color:#90A2B8;">Wen empfiehlst du in meiner Nähe?</div>
        <div style="padding:18px 20px; border-radius:20px; background:#162234; border:1px solid #1E2C40; display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; gap:12px;">
            <span style="font-size:30px; line-height:0.8; font-weight:900; color:#16C98A;">„</span>
            <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
              <div style="height:8px; border-radius:999px; background:rgba(22,201,138,0.45);"></div>
              <div style="height:8px; width:88%; border-radius:999px; background:rgba(22,201,138,0.30);"></div>
              <div style="height:8px; width:64%; border-radius:999px; background:#1E2C40;"></div>
            </div>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; padding-top:4px; border-top:1px solid #1E2C40;">
            <span style="margin-top:12px; padding:6px 14px; border-radius:999px; background:rgba(22,201,138,0.12); border:1px solid rgba(22,201,138,0.35); font-size:14px; font-weight:700; color:#16C98A;">Quelle: deine Website</span>
          </div>
        </div>
      </div>
      <div style="position:relative; padding:28px 28px 30px 28px; display:flex; flex-direction:column; gap:10px;">
        <h3 style="margin:0; font-size:30px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; color:#E8EDF5;">Zitierfähigkeit</h3>
        <p style="margin:0; font-size:17px; line-height:1.55; color:#90A2B8; text-wrap:pretty;">Inhalte in Passagen, die ChatGPT und Perplexity direkt übernehmen können — mit dir als genannter Quelle.</p>
      </div>
    </div>
</div>
</body>
</html>
