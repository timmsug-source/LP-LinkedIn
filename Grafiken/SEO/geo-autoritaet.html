<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorität und Vertrauen — Timm Schurig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#070E1C;font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#16C98A;text-decoration:none}
  a:hover{color:#2FD79A}
  h3{margin:0}
  p{margin:0}
  /* Einzelne Grafik — max-width entfernen, damit sie die volle Spaltenbreite füllt */
  .ts-wrap{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,24px)}
</style>
</head>
<body>
<div class="ts-wrap">
    <div style="position:relative; display:flex; flex-direction:column; border-radius:28px; overflow:hidden; background:#0C1724; border:1px solid #1E2C40; box-shadow:0 24px 60px rgba(0,0,0,0.45);">
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 55% at 18% 92%, rgba(22,201,138,0.20), transparent 70%), radial-gradient(55% 50% at 88% 95%, rgba(78,70,180,0.22), transparent 72%);"></div>
      <div style="position:relative; padding:32px 28px 8px 28px;">
        <div style="position:relative; height:236px;">
          <svg width="100%" height="100%" viewBox="0 0 420 236" fill="none" preserveAspectRatio="xMidYMid meet" style="position:absolute; inset:0;">
            <g stroke="rgba(22,201,138,0.45)" stroke-width="2">
              <path d="M70 46 L210 118"></path>
              <path d="M70 190 L210 118"></path>
              <path d="M350 46 L210 118"></path>
              <path d="M350 190 L210 118"></path>
            </g>
            <g fill="#111B2B" stroke="#1E2C40" stroke-width="1.5">
              <circle cx="70" cy="46" r="26"></circle>
              <circle cx="70" cy="190" r="26"></circle>
              <circle cx="350" cy="46" r="26"></circle>
              <circle cx="350" cy="190" r="26"></circle>
            </g>
            <g fill="#6B7C92">
              <circle cx="70" cy="46" r="5"></circle>
              <circle cx="70" cy="190" r="5"></circle>
              <circle cx="350" cy="46" r="5"></circle>
              <circle cx="350" cy="190" r="5"></circle>
            </g>
            <circle cx="210" cy="118" r="52" fill="rgba(22,201,138,0.12)" stroke="rgba(22,201,138,0.35)" stroke-width="1.5"></circle>
            <circle cx="210" cy="118" r="34" fill="#16C98A"></circle>
            <path d="M198 118l8 8 16-16" stroke="#070E1C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
          </svg>
        </div>
      </div>
      <div style="position:relative; padding:28px 28px 30px 28px; display:flex; flex-direction:column; gap:10px;">
        <h3 style="margin:0; font-size:30px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; color:#E8EDF5;">Autorität und Vertrauen</h3>
        <p style="margin:0; font-size:17px; line-height:1.55; color:#90A2B8; text-wrap:pretty;">Erwähnungen, Belege und konsistente Angaben machen dich zu einer Quelle, auf die sich KI-Systeme verlassen.</p>
      </div>
    </div>
</div>
</body>
</html>
