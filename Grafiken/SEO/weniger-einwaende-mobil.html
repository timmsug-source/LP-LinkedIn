<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weniger Einwände — Timm Schurig (Mobil)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Mobile Variante — kompakte Abstände, feste Schriftgrößen */
  :root{
    --navy-950:#070E1C; --navy-900:#0A1320; --navy-850:#0C1724; --navy-800:#111B2B;
    --navy-750:#162234; --navy-700:#1E2C40; --navy-600:#2A3A52;
    --green-400:#2FD79A; --green-500:#16C98A; --green-700:#0C9E69;
    --ink-100:#E8EDF5; --ink-400:#90A2B8; --ink-500:#6B7C92;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--navy-950);font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--green-500);text-decoration:none}
  a:hover{color:var(--green-400)}

  .ts-benefits{max-width:440px;margin:0 auto;padding:20px 16px}

  .ts-card{position:relative;display:flex;flex-direction:column;overflow:hidden;
    border-radius:22px;background:var(--navy-850);border:1px solid var(--navy-700);
    box-shadow:0 16px 40px rgba(0,0,0,.45)}
  .ts-card__glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(65% 55% at 18% 92%,rgba(22,201,138,.20),transparent 70%),
               radial-gradient(60% 50% at 88% 95%,rgba(78,70,180,.22),transparent 72%)}
  .ts-card__visual{position:relative;display:flex;flex-direction:column;justify-content:flex-end}
  .ts-card__text{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px 20px 24px}
  .ts-card h3{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.08;color:var(--ink-100)}
  .ts-card p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-400);text-wrap:pretty}

  /* Flächen-Chart */
  .ts-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:22px 20px 14px}
  .ts-legend b{font-size:15px;font-weight:800;color:var(--ink-100)}
  .ts-legend span{font-size:15px;color:var(--ink-500)}
  .ts-legend svg{flex:0 0 auto;width:18px;height:18px}
  .ts-chart{display:block;width:100%;height:150px}

  /* Toast-Stapel */
  .ts-stack{position:relative;margin:26px 16px 18px;padding-top:24px}
  .ts-stack__ghost{position:absolute;left:12%;right:12%;top:0;height:34px;border-radius:16px;background:var(--navy-900);border:1px solid var(--navy-700);opacity:.55}
  .ts-stack__ghost--2{left:6%;right:6%;top:12px;background:var(--navy-800);opacity:.8}
  .ts-toast{position:relative;display:flex;gap:14px;padding:16px;border-radius:18px;
    background:var(--navy-750);border:1px solid var(--navy-700);box-shadow:0 18px 40px rgba(0,0,0,.55)}
  .ts-toast__icon{flex:0 0 auto;width:48px;height:48px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;background:rgba(22,201,138,.12);border:1px solid rgba(22,201,138,.35)}
  .ts-toast__icon svg{width:26px;height:26px}
  .ts-toast__body{display:flex;flex-direction:column;gap:6px;min-width:0}
  .ts-toast__head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .ts-toast__head b{font-size:17px;font-weight:900;letter-spacing:-.02em;line-height:1.2;color:var(--ink-100)}
  .ts-pill{padding:2px 10px;border-radius:999px;background:var(--green-500);font-size:14px;font-weight:800;color:var(--navy-950)}
  .ts-toast__body p{font-size:15px;line-height:1.5}

  /* Vorher/Nachher-Balken */
  .ts-bars{position:relative;display:flex;flex-direction:column;gap:20px;padding:28px 20px 10px}
  .ts-bar__row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .ts-bar__label{font-size:15px;color:var(--ink-500)}
  .ts-bar__label--on{color:var(--ink-400)}
  .ts-bar__value{font-size:21px;font-weight:900;letter-spacing:-.02em;color:var(--ink-400)}
  .ts-bar__value--on{font-size:27px;letter-spacing:-.03em;color:var(--green-500)}
  .ts-bar{height:16px;border-radius:999px;background:var(--navy-900);border:1px solid var(--navy-700);overflow:hidden}
  .ts-bar i{display:block;height:100%;border-radius:999px;background:var(--navy-600)}
  .ts-bar i.on{background:linear-gradient(90deg,var(--green-700),var(--green-400));box-shadow:0 0 24px rgba(22,201,138,.35)}
</style>
</head>
<body>

<section class="ts-benefits">

  <article class="ts-card">
    <div class="ts-card__glow"></div>
    <div class="ts-card__visual">
      <div class="ts-legend">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16C98A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 5-5"></path><path d="M14 10h4v4"></path></svg>
        <b>Verkaufsabschlüsse</b>
        <span>· letzte 12 Monate</span>
      </div>
      <svg class="ts-chart" viewBox="0 0 1400 380" fill="none" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="tsFill" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#16C98A" stop-opacity=".38"></stop>
            <stop offset="1" stop-color="#16C98A" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <path d="M0 330 C 160 320, 250 296, 380 288 C 520 280, 600 238, 760 214 C 900 192, 980 132, 1130 96 C 1250 68, 1320 40, 1400 24 L1400 380 L0 380 Z" fill="url(#tsFill)"></path>
        <path d="M0 330 C 160 320, 250 296, 380 288 C 520 280, 600 238, 760 214 C 900 192, 980 132, 1130 96 C 1250 68, 1320 40, 1400 24" stroke="#2FD79A" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
      </svg>
    </div>
    <div class="ts-card__text">
      <h3>Weniger Einwände</h3>
      <p>Erleichtere deine Verkaufsabschlüsse, weil dein Außenauftritt unterbewusst Vertrauen erweckt und Reibungspunkte intelligent reduziert.</p>
    </div>
  </article>

</section>

</body>
</html>
