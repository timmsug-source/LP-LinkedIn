<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02-klicks-sinken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#0C1724;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}.ts-graphic{width:100%;max-width:560px;margin:0 auto}</style>
</head>
<body>
<div class="ts-graphic">
<div style="position:relative;height:320px;border-radius:18px;background:radial-gradient(120% 90% at 100% 100%,rgba(78,70,180,0.2),transparent 60%),#0A1320;border:1px solid #1E2C40;overflow:hidden;padding:22px 22px 0;box-sizing:border-box">
    <div style="height:100%;background:#1f2023;border-radius:14px 14px 0 0;border:1px solid #33353a;border-bottom:none;box-shadow:0 20px 50px rgba(0,0,0,0.5);display:flex;flex-direction:column;font-family:system-ui,-apple-system,sans-serif;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2e3034">
        <div style="color:#e3e3e3;font-size:13px;font-weight:600">Leistung · Suchergebnisse</div>
        <div style="color:#9aa0a6;font-size:11px;border:1px solid #3c4043;border-radius:999px;padding:3px 9px">Letzte 12 Monate</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr)">
        <div style="background:#4285F4;color:#fff;padding:9px 12px;display:flex;flex-direction:column;gap:2px"><span style="font-size:10.5px;opacity:.85">Klicks gesamt</span><span style="font-size:18px;font-weight:600">1.240</span></div>
        <div style="background:#5e35b1;color:#fff;padding:9px 12px;display:flex;flex-direction:column;gap:2px"><span style="font-size:10.5px;opacity:.85">Impressionen</span><span style="font-size:18px;font-weight:600">48,3k</span></div>
        <div style="background:#e8710a;color:#fff;padding:9px 12px;display:flex;flex-direction:column;gap:2px"><span style="font-size:10.5px;opacity:.85">Ø Position</span><span style="font-size:18px;font-weight:600">2,1</span></div>
      </div>
      <div style="flex:1;min-height:0;position:relative;overflow:hidden">
        <svg viewBox="0 0 400 140" preserveAspectRatio="none" style="position:absolute;left:12px;right:12px;top:12px;bottom:8px;width:calc(100% - 24px);height:calc(100% - 20px);display:block">
          <line x1="0" y1="35" x2="400" y2="35" stroke="#2e3034" stroke-width="1"></line>
          <line x1="0" y1="70" x2="400" y2="70" stroke="#2e3034" stroke-width="1"></line>
          <line x1="0" y1="105" x2="400" y2="105" stroke="#2e3034" stroke-width="1"></line>
          <polyline fill="none" stroke="#5e35b1" stroke-width="2" points="0,48 30,44 60,46 90,40 120,43 150,38 180,41 210,37 240,40 270,36 300,39 330,35 360,38 400,34"></polyline>
          <polyline fill="none" stroke="#e8710a" stroke-width="2" points="0,22 30,23 60,21 90,22 120,23 150,21 180,22 210,21 240,23 270,22 300,21 330,22 360,21 400,22"></polyline>
          <polyline fill="none" stroke="#4285F4" stroke-width="2.5" points="0,58 30,54 60,60 90,62 120,70 150,68 180,80 210,86 240,92 270,100 300,106 330,112 360,118 400,124"></polyline>
        </svg>
        <div style="position:absolute;left:46%;top:18px;bottom:8px;border-left:1px dashed #9aa0a6"></div>
        <div style="position:absolute;left:calc(46% + 6px);top:16px;font-size:10px;color:#bdc1c6;background:#1f2023;padding:1px 4px">AI Overviews starten</div>
      </div>
    </div>
    <div style="position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;background:#0C1724;border:1px solid #2A3A52;border-radius:999px;padding:6px 12px;font-size:12px;color:#B8C4D4;box-shadow:0 10px 30px rgba(0,0,0,0.5)">
      Position stabil · <span style="color:#F2615A;font-weight:700">Klicks −58 %</span>
    </div>
  </div>
</div>
</body>
</html>
