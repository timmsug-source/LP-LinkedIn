<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Page SEO — Timm Schurig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#070E1C;font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#16C98A;text-decoration:none}
  a:hover{color:#2FD79A}
  h3{margin:0}
  p{margin:0}
  /* Einzelne Grafik — max-width entfernen, damit sie die volle Spaltenbreite füllt */
  .ts-wrap{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,24px)}
</style>
</head>
<body>
<div class="ts-wrap">
    <div style="position:relative; display:flex; flex-direction:column; border-radius:28px; overflow:hidden; background:#0C1724; border:1px solid #1E2C40; box-shadow:0 24px 60px rgba(0,0,0,0.45);">
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 55% at 18% 92%, rgba(22,201,138,0.20), transparent 70%), radial-gradient(55% 50% at 88% 95%, rgba(78,70,180,0.22), transparent 72%);"></div>
      <div style="position:relative; padding:32px 28px 8px 28px; display:flex; flex-direction:column; gap:14px;">
        <div style="display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:999px; background:#0A1320; border:1px solid #1E2C40;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7C92" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
          <span style="font-size:16px; color:#6B7C92;">dein wichtigstes keyword</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px; padding:18px 20px; border-radius:20px; background:#162234; border:1px solid rgba(22,201,138,0.35); box-shadow:0 0 36px rgba(22,201,138,0.14);">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="width:8px; height:8px; border-radius:999px; background:#16C98A;"></span>
            <span style="font-size:14px; color:#16C98A;">Platz 1 · organisch</span>
          </div>
          <div style="font-size:18px; font-weight:800; letter-spacing:-0.02em; color:#E8EDF5;">Deine Leistung in deiner Stadt</div>
          <div style="height:8px; border-radius:999px; background:#1E2C40;"></div>
          <div style="height:8px; width:72%; border-radius:999px; background:#1E2C40;"></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px; padding:0 20px; opacity:0.5;">
          <div style="height:8px; width:60%; border-radius:999px; background:#1E2C40;"></div>
          <div style="height:8px; width:84%; border-radius:999px; background:#1E2C40;"></div>
        </div>
      </div>
      <div style="position:relative; padding:28px 28px 30px 28px; display:flex; flex-direction:column; gap:10px;">
        <h3 style="margin:0; font-size:30px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; color:#E8EDF5;">On-Page SEO</h3>
        <p style="margin:0; font-size:17px; line-height:1.55; color:#90A2B8; text-wrap:pretty;">Inhalte, Titel und Seitenstruktur so aufgebaut, dass Google sofort versteht, worum es geht — und deine Seite für die richtigen Suchanfragen ausspielt.</p>
      </div>
    </div>
</div>
</body>
</html>
