<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technisches SEO — Timm Schurig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#070E1C;font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  a:hover{color:#2FD79A}
  h3{margin:0}
  p{margin:0}
  /* Einzelne Grafik — max-width entfernen, damit sie die volle Spaltenbreite füllt */
  .ts-wrap{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,24px)}
</style>
</head>
<body>
<div class="ts-wrap">
    <div style="position:relative; display:flex; flex-direction:column; border-radius:28px; overflow:hidden; background:#0C1724; border:1px solid #1E2C40; box-shadow:0 24px 60px rgba(0,0,0,0.45);">
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 55% at 18% 92%, rgba(22,201,138,0.20), transparent 70%), radial-gradient(55% 50% at 88% 95%, rgba(78,70,180,0.22), transparent 72%);"></div>

            <div style="height:8px; border-radius:999px; background:#0A1320; overflow:hidden;"><div style="width:92%; height:100%; background:linear-gradient(90deg,#0C9E69,#2FD79A);"></div></div>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px; padding:18px 20px; border-radius:20px; background:#111B2B; border:1px solid #1E2C40;">
          <div style="display:flex; align-items:center; gap:12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16C98A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"></path></svg>
            <span style="font-size:16px; color:#E8EDF5;">Crawlbar &amp; indexiert</span>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16C98A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"></path></svg>
            <span style="font-size:16px; color:#E8EDF5;">Mobil optimiert</span>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16C98A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"></path></svg>

          </div>
        </div>
      </div>
      <div style="position:relative; padding:28px 28px 30px 28px; display:flex; flex-direction:column; gap:10px;">
        <h3 style="margin:0; font-size:30px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; color:#E8EDF5;">Technisches SEO</h3>
        <p style="margin:0; font-size:17px; line-height:1.55; color:#90A2B8; text-wrap:pretty;">Ladezeit, Crawlbarkeit und Indexierung sauber aufgesetzt, damit deiner Sichtbarkeit technisch nichts im Weg steht.</p>
      </div>
    </div>

</html>
