<!DOCTYPE html>
<html lang="de">
<head>

<title>04-Golive-Betreuung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#070E1C;color:#E8EDF5;font-family:'Hanken Grotesk',system-ui,sans-serif}</style>
</head>
<body>
<div style="width:600px;height:420px;border-radius:24px;border:1px solid #1E2C40;background:radial-gradient(60% 70% at 10% 100%,rgba(22,201,138,.16),transparent 70%),radial-gradient(60% 70% at 100% 100%,rgba(78,70,180,.2),transparent 70%),#0A1320;padding:28px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;align-items:center;justify-content:space-between;background:#111B2B;border:1px solid #1E2C40;border-radius:999px;padding:10px 12px 10px 18px">
    <span style="font-size:13px;color:#B8C4D4">deine-praxis.de</span>
    <span style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#6FE7BE;background:rgba(22,201,138,.12);border:1px solid rgba(22,201,138,.35);padding:5px 12px;border-radius:999px"><span style="width:7px;height:7px;border-radius:50%;background:#16C98A;box-shadow:0 0 8px #16C98A"></span>Live seit 14. März</span>
  </div>
  <div style="flex:1;background:#111B2B;border:1px solid #1E2C40;border-radius:16px;padding:16px 18px;box-shadow:0 24px 48px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:13px;font-weight:700">Organische Besucher</span><span style="font-size:11px;color:#6B7C92">letzte 6 Monate</span></div>
    <div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:28px;font-weight:900;letter-spacing:-.02em">1.284</span><span style="font-size:12px;font-weight:700;color:#16C98A">+212 %</span></div>
    <svg viewBox="0 0 500 110" preserveAspectRatio="none" style="width:100%;flex:1">
      <defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16C98A" stop-opacity=".35"></stop><stop offset="1" stop-color="#16C98A" stop-opacity="0"></stop></linearGradient></defs>
      <line x1="0" y1="30" x2="500" y2="30" stroke="#1E2C40"></line><line x1="0" y1="65" x2="500" y2="65" stroke="#1E2C40"></line><line x1="0" y1="100" x2="500" y2="100" stroke="#1E2C40"></line>
      <line x1="95" y1="0" x2="95" y2="110" stroke="#2A3A52" stroke-dasharray="3 4"></line>
      <path d="M0 98 L45 96 L95 94 L140 88 L190 80 L240 74 L290 60 L340 52 L390 38 L440 30 L500 14 L500 110 L0 110 Z" fill="url(#g4)"></path>
      <path d="M0 98 L45 96 L95 94 L140 88 L190 80 L240 74 L290 60 L340 52 L390 38 L440 30 L500 14" fill="none" stroke="#16C98A" stroke-width="2.5" vector-effect="non-scaling-stroke"></path>

    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#6B7C92"><span>Feb</span><span style="color:#B8C4D4">Launch</span><span>Apr</span><span>Mai</span><span>Jun</span><span>Jul</span><span>Aug</span></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
    <div style="background:#111B2B;border:1px solid #1E2C40;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;color:#90A2B8">SEO-Rankings Top 10</span><span style="font-size:18px;font-weight:800">17 <span style="font-size:11px;color:#16C98A">+9</span></span></div>
    <div style="background:#111B2B;border:1px solid #1E2C40;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;color:#90A2B8">Monatsreport</span><span style="font-size:13px;font-weight:700;color:#6FE7BE">August · versendet</span></div>
    <div style="background:#111B2B;border:1px solid #1E2C40;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;color:#90A2B8">Technik &amp; Updates</span><span style="font-size:13px;font-weight:700">Alles aktuell</span></div>
