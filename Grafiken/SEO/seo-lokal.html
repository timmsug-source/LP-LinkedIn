<!DOCTYPE html>
<html lang="de">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  /* Einzelne Grafik — max-width entfernen, damit sie die volle Spaltenbreite füllt */

<body>
<div class="ts-wrap">
