<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technische Lesbarkeit — Timm Schurig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#070E1C;font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#16C98A;text-decoration:none}
  a:hover{color:#2FD79A}
  h3{margin:0}
  p{margin:0}
  /* Einzelne Grafik — max-width entfernen, damit sie die volle Spaltenbreite füllt */
  .ts-wrap{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,24px)}
</style>
</head>
<body>
<div class="ts-wrap">
    <div style="position:relative; display:flex; flex-direction:column; border-radius:28px; overflow:hidden; background:#0C1724; border:1px solid #1E2C40; box-shadow:0 24px 60px rgba(0,0,0,0.45);">
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 55% at 18% 92%, rgba(22,201,138,0.20), transparent 70%), radial-gradient(55% 50% at 88% 95%, rgba(78,70,180,0.22), transparent 72%);"></div>
      <div style="position:relative; padding:32px 28px 8px 28px;">
        <div style="border-radius:20px; overflow:hidden; background:#0A1320; border:1px solid #1E2C40;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; border-bottom:1px solid #1E2C40;">
            <span style="font-size:14px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color:#6B7C92;">JSON-LD</span>
            <span style="display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:#16C98A;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16C98A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"></path></svg>
              valide
            </span>
          </div>
          <div style="padding:18px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:14px; line-height:1.75; color:#90A2B8;">
            <div>{</div>
            <div style="padding-left:16px;">"@type": <span style="color:#16C98A;">"LocalBusiness"</span>,</div>
            <div style="padding-left:16px;">"name": <span style="color:#16C98A;">"Dein Unternehmen"</span>,</div>
            <div style="padding-left:16px;">"areaServed": <span style="color:#16C98A;">"Deine Region"</span>,</div>
            <div style="padding-left:16px;">"knowsAbout": <span style="color:#16C98A;">"SEO, GEO"</span></div>
            <div>}</div>
          </div>
        </div>
      </div>
      <div style="position:relative; padding:28px 28px 30px 28px; display:flex; flex-direction:column; gap:10px;">
        <h3 style="margin:0; font-size:30px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; color:#E8EDF5;">Technische Lesbarkeit</h3>
        <p style="margin:0; font-size:17px; line-height:1.55; color:#90A2B8; text-wrap:pretty;">Strukturierte Daten und saubere Auszeichnung, damit Maschinen deine Seite zweifelsfrei lesen können.</p>
      </div>
    </div>
</div>
</body>
</html>
