<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angeklickt werden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#070E1C;font-family:'Hanken Grotesk',system-ui,sans-serif;padding:40px;}</style>
</head>
<body>
<!-- Angeklickt werden -->
<div style="max-width:300px;position:relative;height:44px;box-sizing:border-box;border-radius:12px;background:rgba(22,201,138,0.08);border:1px solid rgba(22,201,138,0.35);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 0 24px rgba(22,201,138,0.12);font-family:'Hanken Grotesk',system-ui,sans-serif;">
      <span style="width:20px;height:20px;border-radius:6px;background:#16C98A;color:#070E1C;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;">1</span>
      <div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;">
        <span style="font-size:12px;font-weight:700;color:#16C98A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline;text-underline-offset:2px;">Dein Unternehmen – Startseite</span>
        <span style="height:4px;width:78%;border-radius:2px;background:#1E2C40;"></span>
      </div>
      <svg style="position:absolute;right:18px;bottom:-6px;" width="20" height="20" viewBox="0 0 24 24" fill="#070E1C" stroke="#16C98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path></svg>
</div>
</body>
</html>
